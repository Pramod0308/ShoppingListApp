name: Build & Release APK

on:
  push:
    tags:
      - 'v*' # Trigger release workflow on version tags, e.g., v1.0.0
    branches:
      - main # Allow manual triggers / verification builds on main pushes
  pull_request:
    branches:
      - main

jobs:
  # The web bundle is committed, so the thing that goes wrong is someone editing a
  # source in web-src/ and forgetting to rebuild. This catches that before the APK
  # is built around a stale bundle.
  web:
    name: Check web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Rebuild Bundle
        run: npm run build

      - name: Check Bundle Is Up To Date
        run: |
          if ! git diff --exit-code -- assets/www; then
            echo "::error::assets/www is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  build:
    name: Build Android APK
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # Automatically uses latest stable version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Tag builds are what gets published, so they must be signed with the real
      # upload key. Fail loudly rather than quietly shipping a debug-signed APK.
      - name: Restore Release Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # --android-skip-build-dependency-validation silences Flutter's AGP/Gradle
      # version check. It was added to get a green build and has not been revisited;
      # try removing it when the toolchain is next upgraded.
      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Remove Keystore
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            ShopNest Native Android APK Release.
            Download the `app-release.apk` below and install it directly on your Android device!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
