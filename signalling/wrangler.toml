name = "shopnest-signalling"
main = "index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "SIGNALLING"
class_name = "SignallingRoom"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

# new_sqlite_classes, not new_classes: SQLite-backed Durable Objects are the ones
# available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignallingRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayRoom"]

# Logs and traces for a service that is otherwise invisible when it misbehaves.
[observability]
enabled = true
