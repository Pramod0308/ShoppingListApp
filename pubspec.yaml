name: shopping_list_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Asset directories are not recursive — every subdirectory needs its own entry.
  assets:
    - assets/www/
    - assets/www/fonts/
    - assets/www/icons/
    - assets/www/vendor/
