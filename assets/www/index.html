<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <!-- No maximum-scale or user-scalable=no: blocking pinch-zoom locks out anyone
         who needs to magnify the page to read it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#f8f9ff">
    <!-- Everything the page needs ships with it. The one outbound connection is the
         WebRTC signalling socket; peer connections themselves are not covered by CSP. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        font-src 'self';
        img-src 'self' data:;
        connect-src 'self' wss: https://*.workers.dev;
        base-uri 'none';
        object-src 'none';
        form-action 'none'">

    <title>ShopIt | Smart Shopping List</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- Everything below is served from the bundle: the app must start with no network.
         Fonts come from tools/fetch-fonts.mjs, styles.css from `npm run build:css`. -->
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-bg text-ink min-h-screen antialiased">

    <!-- LOCK SCREEN
         Shown before anything else when a passcode is configured. It is a door, not
         a safe: the lists are in this browser either way, and what it really keeps
         strangers away from is the price service, which costs money per search. -->
    <div id="lockScreen" class="hidden fixed inset-0 z-[200] bg-bg flex items-center justify-center px-6">
        <div class="w-full max-w-xs">
            <h1 class="text-[22px] font-semibold tracking-tight text-center">ShopIt</h1>
            <p class="mt-1 mb-6 text-[13px] text-muted text-center">Enter the passcode to use this app.</p>
            <form id="lockForm" class="flex flex-col gap-2">
                <input id="lockInput" type="password" inputmode="text" autocomplete="current-password"
                       aria-label="Passcode" placeholder="Passcode"
                       class="w-full h-11 bg-surface border border-line rounded-xl px-3 text-[15px] text-ink placeholder:text-faint focus:ring-0 focus:border-accent transition-colors">
                <button id="lockSubmit" type="submit"
                        class="h-11 rounded-xl bg-accent text-accent-ink text-[15px] font-medium transition-opacity hover:opacity-90 active:opacity-80">
                    Unlock
                </button>
            </form>
            <p id="lockError" class="hidden mt-3 text-[12px] text-danger text-center"></p>
            <p class="mt-6 text-[11px] text-faint text-center leading-snug">
                Asked once per device. It keeps strangers out of the app and off the
                price lookups — it does not encrypt your lists.
            </p>
        </div>
    </div>

    <!-- HOME VIEW -->
    <div id="home">
        <header class="sticky top-0 z-50 bg-bg/80 backdrop-blur-xl border-b border-line">
            <div class="flex justify-between items-center px-4 h-14 w-full max-w-lg mx-auto">
                <h1 class="text-[17px] font-semibold tracking-tight">ShopIt</h1>
                <div class="flex items-center gap-0.5">
                    <button id="profileBtn" class="icon-btn w-7 h-7 flex items-center justify-center rounded-full text-[12px] font-semibold text-white transition-opacity hover:opacity-80 mr-1" aria-label="Your name" title="Your name">?</button>
                    <button id="linkDevice" class="icon-btn w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-raised transition-colors" aria-label="Link another device" title="Link another device">
                        <span class="material-symbols-outlined icon-sm">devices</span>
                    </button>
                    <button id="themeToggle" class="icon-btn w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-raised transition-colors" aria-label="Toggle theme" title="Toggle theme">
                        <span class="material-symbols-outlined icon-sm">dark_mode</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-4 pt-4 pb-16 max-w-lg mx-auto w-full">
            <section class="mb-6">
                <div class="flex items-center gap-2 bg-surface border border-line rounded-xl h-11 pl-3 pr-1 focus-within:border-accent transition-colors">
                    <span class="material-symbols-outlined icon-sm text-faint shrink-0">add_circle</span>
                    <input id="newListName" type="text" class="flex-1 min-w-0 bg-transparent border-0 p-0 text-[15px] text-ink placeholder:text-faint focus:ring-0" placeholder="New list">
                    <button id="createListBtn" class="icon-btn shrink-0 h-9 px-3 rounded-lg bg-accent text-accent-ink text-[14px] font-medium transition-opacity hover:opacity-90 active:opacity-80">
                        Create
                    </button>
                </div>
            </section>

            <!-- Joining a list someone sent you.
                 Tapping the link works when the browser has it, but a link that
                 arrives in a chat app on a phone with this installed often opens a
                 different browser than the one holding your lists — and then the
                 list lands somewhere you are not. Pasting it here puts it where you
                 are looking. -->
            <section class="mb-6">
                <div class="flex items-center gap-2 bg-surface border border-line rounded-xl h-11 pl-3 pr-1 focus-within:border-accent transition-colors">
                    <span class="material-symbols-outlined icon-sm text-faint shrink-0">link</span>
                    <input id="joinInput" type="text" inputmode="url" autocomplete="off"
                           class="flex-1 min-w-0 bg-transparent border-0 p-0 text-[15px] text-ink placeholder:text-faint focus:ring-0"
                           placeholder="Paste a list link to join" aria-label="Paste a list link to join">
                    <button id="joinBtn" class="icon-btn shrink-0 h-9 px-3 rounded-lg border border-line text-[14px] font-medium text-ink hover:bg-raised transition-colors">
                        Join
                    </button>
                </div>
                <p id="joinError" class="hidden mt-2 px-1 text-[12px] text-danger"></p>
            </section>

            <section>
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-[12px] font-medium uppercase tracking-wider text-faint">Your lists</h2>
                    <button id="sortToggle" class="flex items-center gap-1 text-[12px] font-medium text-muted hover:text-ink transition-colors" title="Change how lists are ordered">
                        <span class="material-symbols-outlined text-[16px] leading-none">sort</span>
                        <span id="sortLabel">Recent</span>
                    </button>
                </div>
                <div id="listsGrid" class="flex flex-col gap-1.5">
                    <!-- Cards will be injected here via app.js -->
                </div>
            </section>

            <!-- Lists set aside. Intact and still synced, just not in the way.
                 Archiving is recorded per person, so filing one away here does
                 nothing to the home screen of anyone it is shared with. -->
            <section id="archivedSection" class="hidden mt-6">
                <h2 class="text-[12px] font-medium uppercase tracking-wider text-faint mb-2 px-1">
                    Archived · <span id="archivedCount">0</span>
                </h2>
                <div id="archivedGrid" class="flex flex-col gap-1.5"></div>
            </section>
        </main>
    </div>

    <!-- LIST DETAILS VIEW -->
    <div id="listView" class="hidden">
        <header class="sticky top-0 z-50 bg-bg/80 backdrop-blur-xl border-b border-line">
            <div class="flex justify-between items-center gap-2 px-2 h-14 w-full max-w-lg mx-auto">
                <div class="flex items-center gap-1 min-w-0 flex-1">
                    <button id="backHome" aria-label="Back" class="icon-btn w-9 h-9 shrink-0 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-raised transition-colors">
                        <span class="material-symbols-outlined icon-sm">arrow_back</span>
                    </button>
                    <input id="listName" type="text" title="Tap to rename this list" aria-label="List name" class="min-w-0 flex-1 bg-transparent border-0 px-1 -mx-1 rounded text-[17px] font-semibold text-ink focus:ring-0 focus:bg-raised transition-colors" value="List name">
                </div>
                <div class="flex items-center gap-0.5 shrink-0">
                    <button id="toggleDates" class="icon-btn w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-raised transition-colors" aria-label="Toggle timestamps" title="Toggle timestamps">
                        <span class="material-symbols-outlined icon-sm">schedule</span>
                    </button>
                    <button id="themeToggle2" class="icon-btn w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-raised transition-colors" aria-label="Toggle theme" title="Toggle theme">
                        <span class="material-symbols-outlined icon-sm">dark_mode</span>
                    </button>
                    <button id="shareBtn" aria-label="Share this list" title="Share this list" class="icon-btn w-9 h-9 flex items-center justify-center rounded-lg text-muted hover:text-ink hover:bg-raised transition-colors">
                        <span class="material-symbols-outlined icon-sm">share</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="px-4 pt-4 pb-16 max-w-lg mx-auto w-full">
            <section class="mb-4">
                <div class="flex items-end gap-2 bg-surface border border-line rounded-xl p-1 pl-3 focus-within:border-accent transition-colors">
                    <textarea id="itemInput" class="flex-1 min-w-0 bg-transparent border-0 p-0 py-2.5 text-[15px] text-ink placeholder:text-faint focus:ring-0 resize-none leading-snug" placeholder="Add an item" rows="1"></textarea>
                    <button id="addBtn" aria-label="Add item" class="icon-btn shrink-0 w-9 h-9 flex items-center justify-center rounded-lg bg-accent text-accent-ink transition-opacity hover:opacity-90 active:opacity-80">
                        <span class="material-symbols-outlined icon-sm">send</span>
                    </button>
                </div>

                <!-- Cost estimate. Prices come from the Worker in worker/; item text
                     is sent only when this button is pressed. -->
                <div class="mt-3 flex items-center gap-2">
                    <select id="storeSelect" class="flex-1 min-w-0 h-9 bg-surface border border-line rounded-lg text-[13px] text-ink pl-2.5 pr-8 py-0 focus:ring-0 focus:border-accent transition-colors"></select>
                    <button id="estimateBtn" class="icon-btn shrink-0 h-9 px-3 rounded-lg border border-line text-[13px] font-medium text-ink hover:bg-raised transition-colors">
                        Estimate
                    </button>
                </div>
                <p id="estimateSummary" class="hidden mt-2 px-1 text-[12px] text-muted"></p>

                <!-- Every shop's price for every item, side by side. Filled by
                     app.js; it scrolls sideways rather than shrinking the columns
                     to nothing on a narrow phone. -->
                <div id="priceMatrix" class="hidden mt-3 rounded-xl border border-line bg-surface">
                    <!-- Whether these prices still describe the list. An estimate is a
                         photograph: add or rename an item and the table below is
                         answering a question nobody is asking any more. -->
                    <div class="flex items-center gap-1.5 px-2 py-1.5 border-b border-line">
                        <div id="matrixStatus" class="flex items-center gap-1.5 min-w-0 flex-1 text-[11px] leading-tight" aria-live="polite">
                            <span id="matrixStatusDot" class="w-1.5 h-1.5 rounded-full shrink-0"></span>
                            <span id="matrixStatusText" class="min-w-0"></span>
                        </div>
                        <!-- Prices are cached for a week, so without this a wrong or
                             out-of-date answer has no way out but the developer tools. -->
                        <button id="matrixRefresh" class="shrink-0 px-1.5 py-0.5 rounded-md text-[11px] font-medium text-muted hover:text-ink hover:bg-raised transition-colors" title="Look these prices up again, ignoring the saved ones">
                            Refresh
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse text-[12px]">
                            <caption class="sr-only">What each item costs at each shop</caption>
                            <thead id="matrixHead"></thead>
                            <tbody id="matrixBody"></tbody>
                            <tfoot id="matrixFoot"></tfoot>
                        </table>
                    </div>
                </div>

                <div class="mt-3 flex items-center justify-between px-1">
                    <span id="remaining" class="text-[12px] font-medium text-faint">0 remaining</span>
                    <div class="flex items-center gap-1">
                        <button id="clearCompleted" class="px-2 py-1 rounded-md text-[12px] font-medium text-muted hover:text-ink hover:bg-raised transition-colors">
                            Clear done
                        </button>
                        <button id="clearAll" class="px-2 py-1 rounded-md text-[12px] font-medium text-danger hover:bg-danger-soft transition-colors">
                            Clear all
                        </button>
                    </div>
                </div>
            </section>

            <ul id="list" class="flex flex-col gap-1.5">
                <!-- Active items injected here via app.js -->
            </ul>

            <!-- Checked items. Heading and list appear only when non-empty. -->
            <section id="doneSection" class="hidden mt-6">
                <h2 class="text-[12px] font-medium uppercase tracking-wider text-faint mb-2 px-1">
                    Done · <span id="doneCount">0</span>
                </h2>
                <ul id="doneList" class="flex flex-col gap-1.5"></ul>
            </section>

            <!-- Removed items. Each can be put back; Clear is what removes them for good. -->
            <section id="deletedSection" class="hidden mt-6">
                <div class="flex items-center justify-between mb-2 px-1">
                    <h2 class="text-[12px] font-medium uppercase tracking-wider text-faint">
                        Deleted · <span id="deletedCount">0</span>
                    </h2>
                    <button id="purgeDeleted" class="px-2 py-1 rounded-md text-[12px] font-medium text-muted hover:text-danger hover:bg-danger-soft transition-colors" title="Remove these permanently">
                        Clear
                    </button>
                </div>
                <ul id="deletedList" class="flex flex-col gap-1.5"></ul>
            </section>
        </main>
    </div>

    <!-- App Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
